<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Archer TD</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html,body{margin:0;height:100%;background:#12151c;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4efe4}
body{display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
canvas{display:block;touch-action:none;background:#12151c}
#ui{position:fixed;inset:0;z-index:6;display:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box;padding:calc(14px + var(--sat)) calc(14px + var(--sar)) calc(18px + var(--sab)) calc(14px + var(--sal));background:rgba(8,10,14,.82);color:#f4efe4}
#ui h2{font-family:Georgia,'Times New Roman',serif;margin:8px 0 6px;letter-spacing:.03em}
#ui h3{margin:14px 0 6px}
#ui p{line-height:1.35}
.btn{display:inline-block;background:#3c5c34;border:0;color:#fff;border-radius:12px;padding:12px 14px;margin:4px 0;font-size:16px;font-weight:800;min-height:44px;touch-action:manipulation}
.btn.block{display:block;width:100%;font-size:20px;padding:14px}
.btn.go{background:linear-gradient(#4e8a3c,#2d6424)}
.btn.alt{background:#3a4250}
.btn.on{box-shadow:inset 0 0 0 2px #ffd56a}
.row{background:#1c222c;border-radius:12px;padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{opacity:.88;font-size:14px;line-height:1.4}
.spd{display:flex;gap:6px}
.spd .btn{flex:1;margin:0}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#12151c;color:#f4efe4;font-weight:800;text-align:center;padding:24px}
#splash b{font-family:Georgia,serif;font-size:40px;letter-spacing:.04em}
#splash span{margin-top:18px;font-size:18px;opacity:.85;animation:pl 1s infinite alternate}
@keyframes pl{to{opacity:.35}}
#paytoast{position:fixed;left:50%;top:calc(12px + var(--sat));transform:translateX(-50%);z-index:30;background:#2b2540;border:1px solid #b8860b;color:#fff;border-radius:10px;padding:8px 12px;font:14px sans-serif;max-width:90%;text-align:center;display:none}
</style>

<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="splash"><b>ARCHER TD</b><span>Tap to start</span></div>
<div id="paytoast"></div>
<script>
'use strict';
const W=360,H=640;
const HORIZON=108,FIELD_END=428;
const COLS=[48,112,176,240];
const ROWS=[548,608];
const SLOT_R=26;
const SUMMON={x:312,y:548,r:26};
const HEAL={x:312,y:608,r:24};
const CARD={x:8,y:214,w:66,h:88};
const HPBAR={x:34,y:442,w:220,h:13};
const TOP={
  up:{x:156,y:8,w:58,h:34},
  pause:{x:218,y:8,w:52,h:34},
  speed:{x:274,y:8,w:78,h:34}
};
const SPEEDS=[1,2,3,5];
const MAXUP=40;
const BS=2;
const TIER=[
  {name:'Blue',color:'#3aa0ff',dark:'#1a4e96',dmg:9,cd:1.05},
  {name:'Purple',color:'#c86bff',dark:'#6a28a8',dmg:12,cd:0.96},
  {name:'Gold',color:'#ffd24a',dark:'#a07818',dmg:16,cd:0.88},
  {name:'Royal',color:'#ffe7a8',dark:'#c88820',dmg:22,cd:0.8},
  {name:'Mythic',color:'#ff7a3c',dark:'#8a3018',dmg:30,cd:0.72},
  {name:'Ascended',color:'#eef6ff',dark:'#8aa4c8',dmg:40,cd:0.66}
];
const MAXT=TIER.length-1;
const KIND={
  orc:{hp:44,spd:0.052,dps:5.4,coins:3,w:52,h:64,name:'Orc',boss:0},
  knight:{hp:118,spd:0.064,dps:9.5,coins:8,w:76,h:66,name:'Knight',boss:0},
  staff:{hp:740,spd:0.034,dps:15,coins:36,w:90,h:122,name:'Warlord',boss:1},
  beast:{hp:690,spd:0.042,dps:13.5,coins:36,w:112,h:88,name:'Ravager',boss:1}
};
const SPELLS={
  fire:{name:'Fire',ink:'#4a1c0a'},
  arcane:{name:'Arcane',ink:'#2a1048'},
  tornado:{name:'Tornado',ink:'#163044'}
};
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const ui=document.getElementById('ui');
const splash=document.getElementById('splash');
let S=1,clock=0,fatal='',bgDirty=1,fieldBg=null,wallBg=null,sprites=null;
let G=null,mode='menu',ptr=null,lockInputUntil=0,splashGone=false,upgBack='menu';
let AC=null,pad=null,shotGate=0;

const DEF={stage:1,max:1,coins:60,up:{dmg:0,rate:0,energy:0,hp:0,volley:0},pack:0,snd:1,vib:1,mus:1,evo:0,maxp:0,spd:1,slots:null,slotsV:0,hintMerge:0,hintSpell:0,hintAim:0,ent:{},v:18};
let SV;
try{SV=Object.assign({},DEF,JSON.parse(localStorage.archerTD||'{}'));}
catch(e){SV=Object.assign({},DEF);}
SV.up=Object.assign({},DEF.up,SV.up||{});
SV.ent=SV.ent&&typeof SV.ent==='object'?SV.ent:{};
if(!SV.slotsV||!Array.isArray(SV.slots)||SV.slots.length!==8){
  SV.slots=defaultSlots(SV.stage||1);
  SV.slotsV=1;
}else{
  SV.slots=SV.slots.map(s=>{
    if(!s||typeof s!=='object')return null;
    const tier=Math.max(0,Math.min(MAXT,s.tier|0));
    const aim=s.aim&&typeof s.aim.x==='number'&&typeof s.aim.z==='number'?{x:clamp(s.aim.x,0,1),z:clamp(s.aim.z,0,1)}:null;
    return {tier,aim};
  });
}
function defaultSlots(stage){
  const n=stage||1;
  const slots=Array(8).fill(null);
  let tier=0,count=2;
  if(n>=8){tier=1;count=4;}
  if(n>=16){tier=2;count=5;}
  if(n>=28){tier=3;count=6;}
  if(n>=45){tier=3;count=8;}
  for(let i=0;i<count;i++)slots[i]={tier,aim:null};
  if(n>=20&&slots[0])slots[0]={tier:Math.min(MAXT,tier+1),aim:null};
  return slots;
}
function save(){try{localStorage.archerTD=JSON.stringify(SV);}catch(e){}}
const paid=()=>!!(SV.evo||SV.maxp||SV.pack>0);
const dmgMul=()=>SV.maxp?1.8:SV.evo?1.4:1;
const rateMul=()=>SV.maxp?1.4:SV.evo?1.25:1;
function wallMax(){return Math.round(100+(SV.up.hp|0)*22);}
function upCost(k){return Math.floor(30*Math.pow(1.16,SV.up[k]|0)+(SV.up[k]|0)*12);}
function arrowCount(tier){
  let n=1+tier;
  const v=SV.up.volley|0;
  if(v>=8)n++;
  if(v>=20)n++;
  if(v>=32)n++;
  if(SV.maxp)n++;
  return Math.min(8,n);
}
function shotDmg(tier){return TIER[tier].dmg*dmgMul()*(1+0.15*(SV.up.dmg|0));}
function shotCd(tier){return Math.max(0.22,TIER[tier].cd/(rateMul()*(1+0.07*(SV.up.rate|0))));}
function growth(n){return 1+(n-1)*0.3+Math.pow(Math.max(0,n-1),1.22)*0.02;}
function spellPow(){return (1+0.08*(SV.up.energy|0))*(G?1+(G.stageN-1)*0.045:1);}
function spellCd(){return Math.max(3.4,7.6/(1+0.06*(SV.up.energy|0)));}
function summonCost(){return 12+SV.slots.filter(Boolean).length*8;}
function repairCost(){return 14+Math.floor((G?G.stageN:SV.stage)*1.4)+(SV.up.hp|0);}
function repairAmt(){return Math.max(24,Math.round(wallMax()*0.36));}
function fmt(v){v=Math.floor(v||0);if(v>=1000000)return (v/1000000).toFixed(1)+'M';if(v>=10000)return Math.floor(v/1000)+'k';return String(v);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function hash(a,b){let n=Math.imul(a|0,374761393)+Math.imul(b|0,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const ch=i=>Math.max(0,Math.min(255,((n>>i)&255)+amt));
  return '#'+[16,8,0].map(i=>ch(i).toString(16).padStart(2,'0')).join('');
}
function rr(g,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function inRect(p,r){return p.x>=r.x&&p.y>=r.y&&p.x<=r.x+r.w&&p.y<=r.y+r.h;}
function depthT(z){return Math.pow(Math.max(0,z),0.88);}
function project(x,z){
  const t=Math.min(1.05,depthT(z));
  const y=HORIZON+(FIELD_END-HORIZON)*Math.min(1,t);
  const half=58+128*Math.min(1,t);
  return {x:W/2+(x-0.5)*2*half,y,s:0.42+0.72*Math.min(1,t),half,t};
}
function screenToWorld(sx,sy){
  let t=(sy-HORIZON)/(FIELD_END-HORIZON);
  if(sy>=FIELD_END&&sy<FIELD_END+46)t=1;
  if(t<0.01||t>1.08)return null;
  t=clamp(t,0.001,1);
  const z=Math.pow(t,1/0.88);
  const half=58+128*t;
  const x=0.5+(sx-W/2)/(2*half);
  if(x<-0.2||x>1.2)return null;
  return {x:clamp(x,0.03,0.97),z:clamp(z,0.03,0.98)};
}
function slotCenter(i){return {x:COLS[i%4],y:ROWS[(i/4)|0]};}
function slotWorldX(i){const c=slotCenter(i);const half=58+128;return clamp(0.5+(c.x-W/2)/(2*half),0.08,0.92);}
function hitSlot(p){
  for(let i=7;i>=0;i--){
    const s=slotCenter(i);
    if(Math.hypot(p.x-s.x,p.y-(s.y-18))<SLOT_R+8)return i;
  }
  return -1;
}

function fit(){
  const vv=window.visualViewport;
  const iw=vv?vv.width:innerWidth, ih=vv?vv.height:innerHeight;
  const cs=getComputedStyle(document.body);
  const pl=parseFloat(cs.paddingLeft)||0, pr=parseFloat(cs.paddingRight)||0;
  const pt=parseFloat(cs.paddingTop)||0, pb=parseFloat(cs.paddingBottom)||0;
  S=Math.max(0.2,Math.min((iw-pl-pr)/W,(ih-pt-pb)/H));
  const d=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(W*S*d));
  cv.height=Math.max(1,Math.round(H*S*d));
  cv.style.width=Math.round(W*S)+'px';
  cv.style.height=Math.round(H*S)+'px';
  ctx.setTransform(S*d,0,0,S*d,0,0);
  ctx.imageSmoothingEnabled=true;
  bgDirty=1;
}
addEventListener('resize',fit);
if(window.visualViewport){
  visualViewport.addEventListener('resize',fit);
  visualViewport.addEventListener('scroll',fit);
}
fit();

function ac(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,d,type,v,dl){
  if(!SV.snd)return;
  try{
    const a=ac(),T=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(30,f0),T);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),T+d);
    g.gain.setValueAtTime(v,T);
    g.gain.exponentialRampToValueAtTime(0.0001,T+d);
    o.connect(g).connect(a.destination);
    o.start(T);o.stop(T+d+0.02);
  }catch(e){}
}
function noise(d,f0,f1,v,dl){
  if(!SV.snd||!AC)return;
  try{
    const a=ac(),T=a.currentTime+(dl||0);
    const len=Math.max(1,a.sampleRate*d|0);
    const buf=a.createBuffer(1,len,a.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
    const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
    s.buffer=buf;fl.type='lowpass';
    fl.frequency.setValueAtTime(f0,T);
    fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),T+d);
    g.gain.setValueAtTime(v,T);
    g.gain.exponentialRampToValueAtTime(0.0001,T+d);
    s.connect(fl).connect(g).connect(a.destination);
    s.start(T);s.stop(T+d+0.02);
  }catch(e){}
}
function vib(p){if(!SV.vib||!navigator.vibrate)return;try{navigator.vibrate(p);}catch(e){}}
const sfx={
  tap(){tone(520,340,.04,'square',.03);},
  bad(){tone(180,90,.12,'sawtooth',.04);},
  shot(){if(shotGate>0)return;shotGate=.045;noise(.04,2200,900,.04);tone(880,420,.05,'square',.02);},
  merge(){tone(520,780,.08,'triangle',.06);tone(780,1180,.12,'sine',.05,.06);vib(18);},
  fire(){noise(.28,900,180,.12);tone(160,50,.3,'sine',.06);vib(20);},
  arcane(){tone(1800,240,.18,'sawtooth',.05);tone(90,40,.25,'sine',.08,.02);vib([12,16,20]);},
  wind(){noise(.45,700,200,.08);},
  hit(){noise(.05,400,120,.05);},
  thud(){tone(90,40,.08,'sine',.05);},
  heal(){tone(480,720,.1,'sine',.05);},
  buy(){tone(600,900,.08,'triangle',.05);},
  summon(){tone(420,640,.08,'triangle',.05);},
  metal(){tone(180,70,.2,'square',.06);noise(.15,2000,200,.08);vib([16,24,30]);},
  win(){tone(523,523,.12,'triangle',.06);tone(659,659,.14,'triangle',.05,.1);tone(784,784,.2,'triangle',.05,.2);},
  lose(){tone(180,60,.4,'sawtooth',.06);},
  boss(){tone(90,40,.35,'sawtooth',.07);noise(.2,300,80,.08);}
};
function musicSync(){
  if(!SV.mus||!SV.snd){stopPad();return;}
  if(!AC||pad)return;
  try{
    const a=ac(),o1=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
    o1.type='sine';o2.type='sine';
    o1.frequency.value=146;o2.frequency.value=220;
    g.gain.value=.012;
    o1.connect(g);o2.connect(g);g.connect(a.destination);
    o1.start();o2.start();
    pad={o1,o2,g};
  }catch(e){}
}
function stopPad(){if(!pad)return;try{pad.o1.stop();pad.o2.stop();}catch(e){}pad=null;}
function unlockAudio(){try{ac();musicSync();}catch(e){}}

const IS_APP=!!window.IS_IOS_APP;
const QS=new URLSearchParams(location.search);
const TEST_FREE=IS_APP||QS.get('test')==='1';
const PAY_API='https://askangrydoc.com';
const PRICE={evo:249,maxpack:499};
const ITEM_ORDER=['tower_l','tower_r','laser','tlog','max_l','max_r','evo','maxpack'];
const LEGACY={tower_l:1,tower_r:1,laser:1,tlog:1,max_l:1,max_r:1};
let PAY_BUSY=0;
function playerId(){
  let p='';try{p=localStorage.archerPid||'';}catch(e){}
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(p)){
    p='p_'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
    try{localStorage.archerPid=p;}catch(e){}
  }
  return p;
}
function toast(m,ms){
  const t=document.getElementById('paytoast');
  t.textContent=m;t.style.display='block';
  clearTimeout(t._h);
  if(ms!==0)t._h=setTimeout(()=>{t.style.display='none';},ms==null?3400:ms);
}
function refreshUI(){
  try{
    if(mode==='upg')renderUpg(false);
    else if(mode==='pause')renderPause(false);
    else if(mode==='menu'||!G)showMenu();
  }catch(e){}
}
function givePack(n){
  if(n===2){SV.maxp=1;SV.evo=1;}
  else SV.evo=1;
  save();
}
function grantItem(k){
  if(SV.ent[k])return false;
  let ok=false;
  if(k==='evo'){givePack(1);ok=true;}
  else if(k==='maxpack'){givePack(2);ok=true;}
  else if(LEGACY[k]){
    if(!SV.legacyBonus){SV.coins=(SV.coins|0)+150;SV.legacyBonus=1;}
    ok=true;
  }
  if(!ok)return false;
  SV.ent[k]=1;save();return true;
}
async function checkout(k){
  if(!(k in PRICE))return;
  if(TEST_FREE){SV.ent[k]=0;grantItem(k);sfx.win();refreshUI();return;}
  if(SV.ent[k]||PAY_BUSY)return;
  PAY_BUSY=1;toast('Opening secure checkout…',0);
  try{
    const r=await fetch(PAY_API+'/api/game/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:k,playerId:playerId()})});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){await syncEnt();toast('You already own this.');return;}
    if(!r.ok||!j.checkoutUrl)throw new Error(j.error||'Checkout unavailable');
    try{localStorage.archerPending=k;}catch(e){}
    location.href=j.checkoutUrl;
  }catch(e){toast('Could not start payment: '+(e&&e.message||e)+'. Check your connection and try again.',6000);}
  finally{PAY_BUSY=0;}
}
async function syncEnt(){
  if(TEST_FREE)return null;
  try{
    const r=await fetch(PAY_API+'/api/game/entitlements?playerId='+encodeURIComponent(playerId()));
    if(!r.ok)return null;
    const j=await r.json();
    if(j.prices)for(const k in j.prices)if(k in PRICE&&j.prices[k]>0)PRICE[k]=j.prices[k];
    const own=new Set(j.items||[]);let n=0;
    for(const k of ITEM_ORDER)if(own.has(k)&&grantItem(k))n++;
    save();refreshUI();return {own,n};
  }catch(e){return null;}
}
async function restorePurchases(){
  if(TEST_FREE)return;
  const e=prompt('Restore purchases: enter the email you used at checkout');
  if(!e)return;
  try{
    const r=await fetch(PAY_API+'/api/game/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.trim(),playerId:playerId()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Restore failed');
    await syncEnt();
    toast(j.restored?('Restored '+j.restored+' purchase(s).'):(j.items&&j.items.length?'Your purchases are already on this device.':'No purchases found for that email.'),5000);
  }catch(err){toast('Restore failed: '+(err&&err.message||err),5000);}
}
async function payBoot(){
  if(TEST_FREE)return;
  const st=QS.get('purchase'),it=QS.get('item');
  if(st){try{history.replaceState(null,'',location.pathname);}catch(e){}}
  if(st==='cancel'){toast('Payment cancelled — nothing was charged.');try{localStorage.removeItem('archerPending');}catch(e){}}
  if(st==='success'){
    toast('Confirming your payment…',0);
    for(let i=0;i<10;i++){
      const r=await syncEnt();
      if(r&&(!it||r.own.has(it))){toast('Purchase unlocked. Thank you.');try{localStorage.removeItem('archerPending');}catch(e){}return;}
      await new Promise(res=>setTimeout(res,i<4?1500:3000));
    }
    toast('Payment is still processing. It will unlock automatically — reopen the game in a minute.',8000);
    return;
  }
  await syncEnt();
}
function pack(n){if(n!==1&&n!==2)return;checkout(n===1?'evo':'maxpack');}

function bake(w,h,fn){
  const c=document.createElement('canvas');
  c.width=w*2;c.height=h*2;
  const g=c.getContext('2d');
  g.scale(2,2);
  g.lineJoin='round';g.lineCap='round';
  fn(g);
  return c;
}
function buildSprites(){
  const archer=[];
  for(let t=0;t<TIER.length;t++){
    archer[t]=[0,1].map(fr=>bake(80,100,g=>paintArcher(g,t,fr)));
  }
  const orc=[0,1].map(fr=>bake(64,78,g=>paintOrc(g,fr)));
  const knight=[0,1].map(fr=>bake(90,78,g=>paintKnight(g,fr)));
  const staff=[0,1].map(fr=>bake(100,140,g=>paintStaff(g,fr)));
  const beast=[0,1].map(fr=>bake(120,100,g=>paintBeast(g,fr)));
  return {archer,orc,knight,staff,beast};
}
function paintArcher(g,tier,frame){
  const C=TIER[tier].color, D=TIER[tier].dark;

function ensureArt(){
  if(!sprites)sprites=buildSprites();

}
function makeLayer(){
  const c=document.createElement('canvas');
  c.width=W*BS;c.height=H*BS;
  const g=c.getContext('2d');
  g.scale(BS,BS);
  g.lineJoin='round';g.lineCap='round';
  return {c,g};
}
function rebuildLayers(){
  fieldBg=makeLayer();
  wallBg=makeLayer();
  paintField(fieldBg.g);
  paintWall(wallBg.g);
  bgDirty=0;
}

      rr(g,x,y,W/8-8,28,3);g.fill();

  g.fillRect(0,FIELD_END-6,W,5);
}

function makePlan(n){
  const waves=[];
  const wc=Math.min(5,1+Math.ceil(n/2));
  for(let w=0;w<wc;w++){
    const wave=[];
    const orcs=3+w*2+Math.floor(n*0.55);
    let knights=0;
    if(n>=2&&w>=1)knights=1+Math.floor((n-2)/3)+Math.floor(w/2);
    if(n>=6)knights++;
    for(let i=0;i<orcs;i++)wave.push('orc');
    for(let i=0;i<Math.min(8,knights);i++)wave.push('knight');
    waves.push(wave);
  }
  waves.push([n%2===0?'staff':'beast']);
  return waves;
}
function startStage(n){
  n=Math.max(1,Math.min(500,n|0));
  ensureArt();
  if(!Array.isArray(SV.slots)||SV.slots.length!==8){SV.slots=defaultSlots(n);SV.slotsV=1;}
  let spd=SPEEDS.includes(SV.spd)?SV.spd:1;
  if(spd>2&&!paid())spd=2;
  G={
    stageN:n,hp:wallMax(),maxhp:wallMax(),spd,
    en:[],arrows:[],fx:[],floats:[],zones:[],decals:[],
    rt:SV.slots.map(s=>s?{cd:Math.random()*.28,shoot:0,pop:0,tgt:null}:null),
    sel:-1,
    spells:['fire','arcane','tornado'],
    spellShift:0,spellLock:0,nextSpellAt:spellCd(),spellI:3,
    plan:makePlan(n),wi:0,si:0,gap:1.35,doneSpawn:false,
    t:0,shake:0,announce:'WAVE 1',annT:1.5,
    over:null,banner:null,freeze:false,bonus:0,kills:0,hint:'',hintT:0
  };
  SV.spd=spd;
  mode='play';
  ui.style.display='none';
  ptr=null;
  if(!SV.hintMerge){
    G.hint='Drag a matching archer onto another to merge';
    G.hintT=4.2;
    SV.hintMerge=1;
    save();
  }
}
function spawn(kind){
  const K=KIND[kind];
  const grow=growth(G.stageN);
  const e={
    kind,x:.16+Math.random()*.68,z:-.02,
    hp:Math.round(K.hp*grow*(K.boss?(0.34+Math.min(1,G.stageN*0.055)):1)),
    max:0,
    spd:K.spd*(1+Math.min(.32,(G.stageN-1)*.012))*(.92+Math.random()*.16),
    dps:K.dps*Math.sqrt(grow),
    coins:Math.round(K.coins*(1+(G.stageN-1)*.12)),
    ph:Math.random()*6.28,
    corpse:0,corpseT:0,rot:0,fh:0,fv:0,fly:0,kb:0,spin:0,stun:0,burn:0,burnD:0,burnAcc:0,
    hit:0,boss:K.boss,atkT:0,spinT:0,gone:0
  };
  e.max=e.hp;
  if(K.boss){
    e.x=.42+Math.random()*.16;
    G.shake=Math.min(1,G.shake+.6);
    G.announce=K.name.toUpperCase();
    G.annT=2.1;
    sfx.boss();
  }
  G.en.push(e);
  return e;
}
function spawnAt(kind,x,z){const e=spawn(kind);e.x=x;e.z=z;return e;}
function updateSpawner(dt){
  if(G.doneSpawn)return;
  G.gap-=dt;
  if(G.gap>0)return;
  if(G.wi>=G.plan.length){G.doneSpawn=true;return;}
  const wave=G.plan[G.wi];
  if(G.si>=wave.length){
    G.wi++;G.si=0;
    if(G.wi>=G.plan.length){G.doneSpawn=true;return;}
    const boss=KIND[G.plan[G.wi][0]]&&KIND[G.plan[G.wi][0]].boss;
    G.announce=boss?'BOSS':'WAVE '+(G.wi+1);
    G.annT=boss?1.8:1.3;
    G.gap=boss?1.1:2.05;
    return;
  }
  const k=wave[G.si++];
  if(G.en.length<26)spawn(k);
  else{G.si--;G.gap=.25;return;}
  G.gap=KIND[k].boss?0.45:Math.max(.36,.7-G.stageN*.015);
}
function hurt(e,dmg,col,big){
  if(!e||e.corpse)return;
  dmg=Math.max(1,Math.round(dmg));
  e.hp-=dmg;
  e.hit=.12;
  floatDmg(e,dmg,col||'#fff',big);
  if(e.hp<=0)kill(e);
}
function kill(e){
  if(e.corpse)return;
  e.corpse=1;e.corpseT=0;e.rot=0;e.fly=0;e.fh=0;
  e.hp=0;
  SV.coins=(SV.coins|0)+e.coins;
  G.kills++;
  if(e.boss||e.kind==='knight')floatScreen(project(e.x,e.z).x,project(e.x,e.z).y-20,'+'+e.coins,'#ffd56a',0);
  sfx.hit();
}
function floatDmg(e,text,col,big){
  const p=project(e.x,e.z);
  const lift=(e.fh||0)*90*p.s;
  floatScreen(p.x+(Math.random()*12-6),p.y-28-lift,text,col,big);
}
function floatScreen(x,y,s,c,big){
  if(!G)return;
  if(G.floats.length>30)G.floats.shift();
  G.floats.push({x,y,vy:-34-Math.random()*16,l:.78,s:String(s),c:c||'#fff',big:big?1:0});
}
function launch(e){
  e.fly=1;e.fh=.1;e.fv=3.35;e.kb=1.15;e.spin=0;e.stun=0;
}
function cast(kind,x,z){
  if(!G||G.over)return;
  const pow=spellPow();
  if(kind==='fire'){
    const R=.19*(1+.012*(SV.up.energy|0));
    for(const e of G.en)if(!e.corpse&&Math.hypot(e.x-x,e.z-z)<R){
      hurt(e,48*pow,'#ffb15a',1);
      e.burn=2.4;e.burnD=12*pow;
    }
    G.zones.push({kind,x,z,r:R,t:0,life:.7});
    G.decals.push({x,z,r:R,color:'rgba(90,40,16,.8)',life:4,max:4});
    sfx.fire();G.shake=Math.min(1,G.shake+.4);
  }else if(kind==='arcane'){
    const R=.21*(1+.012*(SV.up.energy|0));

    for(let i=0;i<5;i++){

      bolts.push(pts);
    }
    for(const e of G.en)if(!e.corpse&&Math.hypot(e.x-x,e.z-z)<R){
      hurt(e,64*pow,'#e2c2ff',1);
      if(e.kind==='orc')launch(e);
      else if(e.kind==='knight'){e.stun=Math.max(e.stun,.8);e.z=Math.max(.05,e.z-.07);}
      else e.stun=Math.max(e.stun,.28);
    }
    G.zones.push({kind,x,z,r:R,t:0,life:.5,bolts});
    sfx.arcane();G.shake=Math.min(1,G.shake+.55);
  }else{
    const R=.26*(1+.015*(SV.up.energy|0));
    G.zones.push({kind,x,z,r:R,t:0,life:2.25,tick:.1,dps:26*pow});

function castTop(x,z){
  if(!G||!G.spells.length||G.spellLock>0||G.over)return;
  const k=G.spells.shift();
  G.spellShift=1;G.spellLock=.28;
  cast(k,x,z);
}
function pickTarget(i){
  const s=SV.slots[i];
  if(!s||!G)return null;
  const rt=G.rt[i];
  const ax=slotWorldX(i);
  let best=null,bestD=1e9;
  const scored=[];
  for(const e of G.en){
    if(e.corpse)continue;
    const d=s.aim?Math.hypot(e.x-s.aim.x,e.z-s.aim.z):Math.hypot((e.x-ax)*0.65,(1-e.z)*1.35);
    scored.push([d,e]);
  }
  scored.sort((a,b)=>a[0]-b[0]);
  if(scored.length){
    best=scored[0][1];bestD=scored[0][0];
    if(!s.aim&&scored.length>1){
      const focused=G.rt.reduce((n,r)=>n+(r&&r.tgt===best?1:0),0);
      if(focused>=2&&scored[1][0]<bestD+.2){best=scored[1][1];bestD=scored[1][0];}
    }
  }
  if(!s.aim&&rt&&rt.tgt&&!rt.tgt.corpse&&G.en.indexOf(rt.tgt)>=0){
    const td=Math.hypot((rt.tgt.x-ax)*0.65,(1-rt.tgt.z)*1.35);
    if(td<bestD+.1){best=rt.tgt;bestD=td;}
  }
  if(rt)rt.tgt=best;
  if(s.aim){
    if(best&&bestD<=.34)return {enemy:best,point:s.aim};
    return {enemy:null,point:s.aim};
  }
  return best?{enemy:best,point:null}:null;
}
function archerMuzzle(i){const s=slotCenter(i);return {x:s.x-8,y:s.y-48};}
function enemyView(e){
  const p=project(e.x,e.z);
  const K=KIND[e.kind];
  const lift=(e.fh||0)*90*p.s+(e.spinT||0)*18*p.s;
  return {p,K,lift,w:K.w*p.s,h:K.h*p.s};
}
function fireAt(i,enemy,point){
  const s=SV.slots[i];
  const n=arrowCount(s.tier);
  const m=archerMuzzle(i);
  const col=TIER[s.tier].color;
  const dmg=shotDmg(s.tier);
  let tx,ty;
  if(enemy){
    const sc=enemyView(enemy);
    tx=sc.p.x;ty=sc.p.y-sc.h*.58-sc.lift;
  }else{
    const p=project(point.x,point.z);
    tx=p.x;ty=p.y;
  }
  const ang=Math.atan2(ty-m.y,tx-m.x);
  for(let a=0;a<n;a++){
    if(G.arrows.length>=72)break;
    const spread=(a-(n-1)/2);
    G.arrows.push({
      x:m.x+Math.cos(ang+1.57)*spread*4,
      y:m.y+Math.sin(ang+1.57)*spread*4,
      tx,ty,delay:a*.042,v:560,color:col,dmg,target:enemy||null,life:1.25,ang
    });
  }
  G.rt[i].shoot=.16;
  sfx.shot();
}
function updateArchers(dt){
  for(let i=0;i<8;i++){
    const s=SV.slots[i],rt=G.rt[i];
    if(!s||!rt)continue;
    if(rt.pop>0)rt.pop=Math.max(0,rt.pop-dt);
    if(rt.shoot>0)rt.shoot=Math.max(0,rt.shoot-dt);
    rt.cd-=dt;
    if(rt.cd>0)continue;
    const pick=pickTarget(i);
    if(!pick||(!pick.enemy&&!pick.point)){rt.cd=0;continue;}
    fireAt(i,pick.enemy,pick.point);
    rt.cd=shotCd(s.tier);
  }
}
function updateEnemies(dt){
  for(let i=G.en.length-1;i>=0;i--){
    const e=G.en[i];
    if(e.corpse){
      e.corpseT+=dt;
      e.rot=Math.min(1.35,e.corpseT*2.4);
      if(e.corpseT>1.25){G.en.splice(i,1);}
      continue;
    }
    if(e.hit>0)e.hit-=dt;
    if(e.burn>0){
      e.burn-=dt;e.burnAcc+=dt;
      if(e.burnAcc>.28){
        e.burnAcc=0;
        hurt(e,e.burnD*.28,'#ff8a3a',0);
        if(e.corpse)continue;
      }
    }
    if(e.spinT>0)e.spinT-=dt;
    if(e.fly){
      e.fh+=e.fv*dt;
      e.fv-=4.2*dt;
      e.z-=e.kb*dt;
      e.kb*=Math.pow(.22,dt);
      e.spin+=dt*9;
      e.z=Math.max(.04,e.z);
      if(e.fh<=0&&e.fv<0){e.fly=0;e.fh=0;e.spin=0;}
      continue;
    }
    let spd=e.spd;
    if(e.stun>0){e.stun-=dt;spd*=.2;}
    if(e.z>=.985){
      e.z=.985;
      G.hp-=e.dps*dt;
      e.atkT-=dt;
      if(e.atkT<=0){e.atkT=.4;G.shake=Math.min(1,G.shake+.12);sfx.thud();}
    }else{
      e.z+=spd*dt;
      e.x=clamp(e.x+Math.cos(G.t*1.3+e.ph)*.015*dt,.06,.94);
    }
  }
  if(G.hp<=0&&!G.over){G.hp=0;defeat();}
}
function updateArrows(dt){
  for(let i=G.arrows.length-1;i>=0;i--){
    const a=G.arrows[i];
    a.life-=dt;
    if(a.delay>0){a.delay-=dt;if(a.life<=0)G.arrows.splice(i,1);continue;}
    if(a.target&&!a.target.corpse){
      const sc=enemyView(a.target);
      a.tx=sc.p.x;a.ty=sc.p.y-sc.h*.58-sc.lift;
    }
    const dx=a.tx-a.x,dy=a.ty-a.y;
    const dist=Math.hypot(dx,dy)||.0001;
    a.ang=Math.atan2(dy,dx);
    const step=a.v*dt;
    if(dist<=step+6){
      if(a.target&&!a.target.corpse)hurt(a.target,a.dmg,a.color,0);
      G.fx.push({k:'spark',x:a.tx,y:a.ty,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,t:0,life:.18,color:a.color,s:2});
      G.arrows.splice(i,1);
    }else if(a.life<=0){
      G.arrows.splice(i,1);
    }else{
      a.x+=dx/dist*step;a.y+=dy/dist*step;
    }
  }
}
function updateZones(dt){
  for(let i=G.zones.length-1;i>=0;i--){
    const z=G.zones[i];
    z.t+=dt;
    if(z.kind==='tornado'){
      z.tick-=dt;
      for(const e of G.en){
        if(e.corpse)continue;
        const dx=z.x-e.x,dz=z.z-e.z,d=Math.hypot(dx,dz);
        if(d<z.r&&d>.001){
          const str=(e.boss?.35:1)*(1-d/z.r);
          e.x=clamp(e.x+dx/d*str*2.8*dt,.05,.95);
          e.z=clamp(e.z+dz/d*str*1.8*dt,.04,.985);
          if(e.kind==='orc')e.spinT=Math.max(e.spinT||0,.2);
          if(z.tick<=0)hurt(e,z.dps*.22,'#e7f4ff',0);
        }
      }
      if(z.tick<=0)z.tick=.22;
    }
    if(z.t>=z.life)G.zones.splice(i,1);
  }
}
function updateFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){

function checkWin(){

function tickAftermath(dt){

function update(dt){

  if(G.spellShift>0)G.spellShift=Math.max(0,G.spellShift-dt*4.5);
  if(G.spellLock>0)G.spellLock-=dt;

  updateSpawner(dt);
  updateArchers(dt);
  updateEnemies(dt);

function dropUnit(from,to){
  if(!G||from===to||from<0||to<0)return 'no';
  const A=SV.slots[from],B=SV.slots[to];
  if(!A)return 'no';
  const follow=()=>{
    if(G.sel===from||G.sel===to)G.sel=SV.slots[to]?to:(SV.slots[from]?from:-1);
  };
  if(!B){
    SV.slots[to]=A;SV.slots[from]=null;
    G.rt[to]=G.rt[from];G.rt[from]=null;
    follow();save();return 'move';
  }
  if(A.tier===B.tier&&A.tier<MAXT){
    SV.slots[to]={tier:A.tier+1,aim:null};
    SV.slots[from]=null;
    G.rt[to]={cd:.3,shoot:0,pop:1,tgt:null};
    G.rt[from]=null;
    follow();
    mergeFx(to,SV.slots[to].tier);
    sfx.merge();
    save();
    return 'merge';
  }
  if(A.tier===B.tier){
    floatScreen(slotCenter(to).x,slotCenter(to).y-60,'MAX','#ffd56a',1);
    sfx.bad();
    return 'max';
  }
  SV.slots[from]=B;SV.slots[to]=A;
  const rt=G.rt[from];G.rt[from]=G.rt[to];G.rt[to]=rt;
  if(G.sel===from)G.sel=to;else if(G.sel===to)G.sel=from;
  save();
  return 'swap';
}

function drawDecals(){

function drawZones(front){

    if(z.kind==='tornado'){

      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(clock*3);
      ctx.strokeStyle='rgba(226,240,255,.75)';ctx.lineWidth=3;

      ctx.globalAlpha=.8*k;

function gp(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/(r.width/W),y:(e.clientY-r.top)/(r.height/H)};
}
function hitRound(p,c){return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8;}
function onDown(e){
  if(performance.now()<lockInputUntil)return;
  if(mode==='end'){
    e.preventDefault();
    if(G&&G.banner&&G.banner.settled)pressEnd(gp(e));
    return;
  }
  if(mode!=='play'||!G)return;
  e.preventDefault();
  const p=gp(e);
  if(ptr)return;
  ptr={id:e.pointerId,x:p.x,y:p.y,ox:p.x,oy:p.y,moved:false,drag:null,slot:-1};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(inRect(p,TOP.speed)){ptr.ui='speed';return;}
  if(inRect(p,TOP.pause)){ptr.ui='pause';return;}
  if(inRect(p,TOP.up)){ptr.ui='up';return;}
  if(hitRound(p,SUMMON)){ptr.ui='summon';return;}
  if(hitRound(p,HEAL)){ptr.ui='heal';return;}
  if(G.spells.length&&inRect(p,{x:CARD.x-6,y:CARD.y-6,w:CARD.w+18,h:CARD.h+18})){ptr.drag='spell';return;}
  const slot=hitSlot(p);
  if(slot>=0&&SV.slots[slot]){ptr.drag='unit';ptr.slot=slot;return;}
  ptr.field=true;
}
function onMove(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  const p=gp(e);
  if(Math.hypot(p.x-ptr.ox,p.y-ptr.oy)>12)ptr.moved=true;
  ptr.x=p.x;ptr.y=p.y;
}
function onUp(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  const was=ptr;ptr=null;
  if(mode!=='play'||!G)return;
  const p=gp(e);
  if(was.ui){
    if(!was.moved){
      if(was.ui==='speed')cycleSpeed();
      else if(was.ui==='pause')renderPause(true);
      else if(was.ui==='up')openUpg();
      else if(was.ui==='summon')summon();
      else if(was.ui==='heal')healWall();
    }
    return;
  }
  if(was.drag==='spell'){
    if(was.moved){
      const w=screenToWorld(p.x,p.y);
      if(w)castTop(w.x,w.z);
    }
    return;
  }
  if(was.drag==='unit'){
    if(!was.moved){tapArcher(was.slot);return;}
    const to=hitSlot(p);
    if(to>=0)dropUnit(was.slot,to);
    return;
  }
  if(was.field&&!was.moved&&G.sel>=0&&SV.slots[G.sel]){
    const w=screenToWorld(p.x,p.y);
    if(w){SV.slots[G.sel].aim={x:w.x,z:w.z};save();sfx.tap();}
  }
}
function pressEnd(p){
  for(const b of endButtons()){
    if(!inRect(p,b))continue;
    sfx.tap();
    if(b.id==='go')startStage(G.over==='win'?SV.stage:G.stageN);
    else if(b.id==='up')openUpg();
    else showMenu();
    return;
  }
}
cv.addEventListener('pointerdown',onDown);
cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{
  if(mode==='play'||mode==='end'||e.target===cv)e.preventDefault();
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&mode==='play'){renderPause(true);return;}
  if(mode!=='play'||!G)return;
  if(e.key==='u'||e.key==='U')openUpg();
  else if(e.key==='r'||e.key==='R')healWall();
  else if(e.key==='n'||e.key==='N')summon();
  else if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='5')setSpeed(+e.key);
});

function shopHTML(){
  return `<h3>Speed packs</h3>
  <p class="note">1× and 2× are free. 3× and 5× unlock with either pack. ${TEST_FREE?'Test mode: unlocks are free.':'Secure PayMongo checkout (GCash, Maya, or card). Prices in ₱.'}</p>
  <div class="row"><span><b>Evolve Pack</b><br><small>+40% damage, +25% fire rate, 3×/5× speed</small></span>${SV.evo?'<b>OWNED</b>':`<button class="btn" data-act="pack" data-n="1">${TEST_FREE?'Unlock':'₱'+PRICE.evo}</button>`}</div>
  <div class="row"><span><b>Max Pack</b><br><small>+80% damage, +40% fire rate, +1 arrow, 3×/5× speed</small></span>${SV.maxp?'<b>OWNED</b>':`<button class="btn" data-act="pack" data-n="2">${TEST_FREE?'Unlock':'₱'+PRICE.maxpack}</button>`}</div>
  ${TEST_FREE?'':'<button class="btn alt" data-act="restore">Restore purchases</button>'}`;
}
function togglesHTML(){
  return `<div class="spd">
    <button class="btn alt" data-act="snd">Sound ${SV.snd?'On':'Off'}</button>
    <button class="btn alt" data-act="mus">Music ${SV.mus?'On':'Off'}</button>
    <button class="btn alt" data-act="vib">Vibe ${SV.vib?'On':'Off'}</button>
  </div>`;
}
function showMenu(){
  mode='menu';
  ui.style.display='block';
  ui.innerHTML=`<h2>Archer TD</h2>
  <p>Stage <b>${SV.stage}</b> · ${fmt(SV.coins)} coins${paid()?' · speed unlocked':''}</p>
  <button class="btn block go" data-act="play">Play stage ${SV.stage}</button>
  ${SV.stage>1?`<button class="btn alt block" data-act="replay">Replay stage ${SV.stage-1}</button>`:''}
  <button class="btn alt block" data-act="open-upg">Upgrades</button>
  <h3>How to play</h3>
  <p class="note">Enemies march down the field to your wall. Archers shoot the nearest foe. Drag one archer onto another of the same color to merge it: blue, purple, gold, royal, and beyond. Higher tiers fire more arrows in that color. Drag Fire, Arcane, or Tornado from the stack onto the field. Arcane lightning throws small orcs into the air. Tap an archer, then the field, to aim it. Heal the wall, or raise its max HP, during the fight. Speed runs at 1× and 2× free; 3× and 5× come with a pack.</p>
  ${togglesHTML()}
  <p><button class="btn alt" data-act="reset">Reset save</button></p>`;
}
function renderPause(reset){
  if(!G){showMenu();return;}
  const y=reset?0:ui.scrollTop;
  mode='pause';ptr=null;
  ui.style.display='block';
  const resume=`<button class="btn block go" data-act="resume">▶ Resume</button>`;
  ui.innerHTML=resume+`<h2>Paused</h2><p>Stage ${G.stageN} · ${fmt(SV.coins)} coins · ${G.spd}×</p>`+togglesHTML()+`<button class="btn alt block" data-act="open-upg">Upgrades</button>`+shopHTML()+resume+`<p><button class="btn alt" data-act="menu">Main menu</button></p>`;
  ui.scrollTop=y;
}
function openUpg(){
  upgBack=mode==='menu'?'menu':mode==='pause'?'pause':mode==='end'?'end':'play';
  ptr=null;
  renderUpg(true);
}
function renderUpg(reset){
  const y=reset?0:ui.scrollTop;
  mode='upg';
  ui.style.display='block';
  const fromPlay=upgBack==='play';
  const resume=`<button class="btn block go" data-act="resume">${fromPlay?'▶ Resume':'◀ Back'}</button>`;
  const f=fmt;
  const rows=[
    ['dmg','Archer damage','+15% each level'],
    ['rate','Fire rate','+7% each level'],
    ['volley','Volley','More arrows at levels 8, 20 and 32'],
    ['energy','Spell flow','Stronger spells, faster cards'],
    ['hp','Wall HP','+22 max HP, also heals that amount now']
  ];
  let body=resume;
  body+=`<p class="note">${G?'Stage '+G.stageN+' · wall '+Math.ceil(G.hp)+'/'+G.maxhp+' · ':''}${f(SV.coins)} coins. The fight stays paused. Merging raises arrows per shot. Volley and the Max Pack add more.</p><h2>Upgrades</h2>`;
  for(const [k,name,desc] of rows){
    const lv=SV.up[k]|0;
    body+=`<div class="row"><span><b>${name}</b> Lv ${lv}${lv>=MAXUP?' MAX':''}<br><small>${desc}${k!=='hp'&&k!=='energy'&&k!=='volley'?'':''}</small></span>${lv>=MAXUP?'<b>MAX</b>':`<button class="btn" data-act="buy" data-k="${k}">${f(upCost(k))} coins</button>`}</div>`;
  }
  if(G&&!G.over){
    const full=G.hp>=G.maxhp-.5;
    body+=`<h3>During this stage</h3>
    <div class="row"><span><b>Repair wall</b><br><small>Heal ${repairAmt()} HP</small></span><button class="btn" data-act="repair" ${full?'disabled':''}>${full?'Full':f(repairCost())+' coins'}</button></div>
    <div class="row"><span><b>Raise wall HP</b><br><small>Permanent +22 max and heal it now</small></span><button class="btn" data-act="raise">${(SV.up.hp|0)>=MAXUP?'MAX':f(upCost('hp'))+' coins'}</button></div>`;
  }else{
    body+=`<p class="note">Raise Wall HP here any time. Repair is on the battlefield once a stage has started.</p>`;
  }
  body+=`<h3>Speed</h3><div class="spd">`;
  const cur=G?G.spd:(SV.spd||1);
  for(const s of SPEEDS){
    const locked=s>2&&!paid();
    body+=`<button class="btn ${cur===s?'on':''}" data-act="spd" data-s="${s}">${s}×${locked?' 🔒':''}</button>`;
  }
  body+=`</div>`;
  if(G){
    body+=`<h3>Manual aim</h3>`;
    let any=false;
    SV.slots.forEach((s,i)=>{
      if(!s)return;
      if(s.aim)any=true;
      body+=`<div class="row"><span>${TIER[s.tier].name} · ${arrowCount(s.tier)} arrows${s.aim?' · aimed':''}</span>${s.aim?`<button class="btn alt" data-act="unaim" data-i="${i}">Reset aim</button>`:''}</div>`;
    });
    if(any)body+=`<button class="btn alt" data-act="unaim-all">Reset all aim</button>`;
    else body+=`<p class="note">Tap an archer, then tap the field. Tap the archer again to return it to auto.</p>`;
  }
  body+=shopHTML()+resume;
  ui.innerHTML=body;
  ui.scrollTop=y;
}
function leaveUpg(){
  if(upgBack==='pause')renderPause(true);
  else if(upgBack==='menu'||!G)showMenu();
  else if(upgBack==='end'){mode='end';ui.style.display='none';}
  else {mode='play';ui.style.display='none';}
}
ui.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||performance.now()<lockInputUntil)return;
  const act=b.dataset.act;
  if(act==='resume'){if(mode==='upg')leaveUpg();else if(G&&G.over){mode='end';ui.style.display='none';}else if(G){mode='play';ui.style.display='none';}else showMenu();sfx.tap();return;}
  if(act==='play'){startStage(SV.stage);return;}
  if(act==='replay'){startStage(Math.max(1,(SV.stage|0)-1));return;}
  if(act==='open-upg'){openUpg();return;}
  if(act==='menu'){showMenu();return;}
  if(act==='buy'){buyUp(b.dataset.k);if(mode==='upg')renderUpg(false);return;}
  if(act==='repair'){healWall();if(mode==='upg')renderUpg(false);return;}
  if(act==='raise'){raiseWall();if(mode==='upg')renderUpg(false);return;}
  if(act==='spd'){setSpeed(b.dataset.s);if(mode==='upg')renderUpg(false);else if(mode==='pause')renderPause(false);return;}
  if(act==='unaim'){const i=+b.dataset.i;if(SV.slots[i])SV.slots[i].aim=null;save();renderUpg(false);return;}
  if(act==='unaim-all'){SV.slots.forEach(s=>{if(s)s.aim=null;});save();renderUpg(false);return;}
  if(act==='snd'){SV.snd^=1;save();if(!SV.snd)stopPad();else musicSync();refreshToggle();return;}
  if(act==='mus'){SV.mus^=1;save();musicSync();refreshToggle();return;}
  if(act==='vib'){SV.vib^=1;save();if(SV.vib)vib(30);refreshToggle();return;}
  if(act==='pack'){pack(+b.dataset.n);return;}
  if(act==='restore'){restorePurchases();return;}
  if(act==='reset'){if(confirm('Reset all progress on this device?')){localStorage.removeItem('archerTD');location.reload();}}
});
function refreshToggle(){if(mode==='pause')renderPause(false);else if(mode==='menu')showMenu();}

function setupScene(name){
  startStage(name==='boss'?6:4);
  const tiers=[0,1,1,2,2,3,4,3];
  for(let i=0;i<8;i++){
    SV.slots[i]={tier:tiers[i],aim:i===2?{x:.62,z:.5}:null};
    G.rt[i]={cd:.05,shoot:.12,pop:0,tgt:null};
  }
  G.spells=['fire','arcane','tornado'];
  spawnAt('orc',.30,.42);
  spawnAt('orc',.48,.62);
  spawnAt('orc',.66,.78);
  spawnAt('knight',.38,.55);
  spawnAt('knight',.72,.7);
  if(name==='boss')spawnAt('beast',.52,.28);
  else spawnAt('staff',.50,.24);
  G.hp=Math.round(G.maxhp*.72);
  for(let i=0;i<36;i++)update(1/60);
  if(name==='merge'){
    SV.slots[0]={tier:1,aim:null};
    SV.slots[1]={tier:1,aim:null};
    G.rt[0]={cd:0,shoot:0,pop:0,tgt:null};
    G.rt[1]={cd:0,shoot:0,pop:0,tgt:null};
    dropUnit(0,1);
    for(const f of G.fx)if(f.k==='ring'||f.k==='flash')f.t=f.life*.32;
  }
  if(name==='defeat'){
    G.hp=0;defeat();
    if(G.banner){G.banner.y=228;G.banner.settled=true;G.banner.hit=true;}
  }
  if(name==='victory'){
    G.en=[];G.doneSpawn=true;victory();
    if(G.banner){G.banner.y=228;G.banner.settled=true;G.banner.hit=true;}
  }
  if(name==='upg')openUpg();
  else G.freeze=true;
}
function runSelfTest(){
  const lines=[];
  const check=(name,fn)=>{
    try{const r=fn();lines.push((r?'PASS ':'FAIL ')+name);}
    catch(e){lines.push('FAIL '+name+' :: '+(e&&e.message||e));}
  };
  const saved=JSON.stringify(SV);
  check('project roundtrip',()=>{
    const p=project(.37,.62);const w=screenToWorld(p.x,p.y);
    return w&&Math.abs(w.x-.37)<.04&&Math.abs(w.z-.62)<.04;
  });
  check('merge identical tiers',()=>{
    startStage(1);
    SV.slots[0]={tier:0,aim:null};SV.slots[1]={tier:0,aim:null};
    G.rt[0]={cd:0,shoot:0,pop:0,tgt:null};G.rt[1]={cd:0,shoot:0,pop:0,tgt:null};
    const r=dropUnit(0,1);
    return r==='merge'&&SV.slots[1]&&SV.slots[1].tier===1&&!SV.slots[0];
  });
  check('move to empty slot',()=>{
    SV.slots[3]={tier:2,aim:{x:.2,z:.4}};SV.slots[4]=null;G.rt[3]={cd:0,shoot:0,pop:0,tgt:null};G.rt[4]=null;
    dropUnit(3,4);
    return SV.slots[4]&&SV.slots[4].tier===2&&SV.slots[4].aim&&Math.abs(SV.slots[4].aim.x-.2)<.001&&!SV.slots[3];
  });
  check('swap different tiers',()=>{
    SV.slots[5]={tier:0,aim:null};SV.slots[6]={tier:2,aim:null};
    G.rt[5]={cd:0,shoot:0,pop:0,tgt:null};G.rt[6]={cd:0,shoot:0,pop:0,tgt:null};
    dropUnit(5,6);
    return SV.slots[5].tier===2&&SV.slots[6].tier===0;
  });
  check('max tier does not merge',()=>{
    SV.slots[0]={tier:MAXT,aim:null};SV.slots[1]={tier:MAXT,aim:null};
    G.rt[0]={cd:0,shoot:0,pop:0,tgt:null};G.rt[1]={cd:0,shoot:0,pop:0,tgt:null};
    const r=dropUnit(0,1);
    return r==='max'&&SV.slots[0].tier===MAXT&&SV.slots[1].tier===MAXT;
  });
  check('more arrows as tier and volley rise',()=>{
    const mp=SV.maxp;SV.maxp=0;SV.up.volley=0;
    const a=arrowCount(0)===1&&arrowCount(1)===2&&arrowCount(3)===4&&arrowCount(5)===6;
    SV.up.volley=20;
    const b=arrowCount(0)===3;
    SV.up.volley=0;SV.maxp=1;
    const c=arrowCount(0)===2;
    SV.maxp=mp;SV.up.volley=0;
    return a&&b&&c;
  });
  check('volley actually fires extra arrows',()=>{
    startStage(1);
    for(let i=0;i<8;i++){SV.slots[i]=null;G.rt[i]=null;}
    SV.up.volley=0;SV.maxp=0;
    SV.slots[0]={tier:2,aim:null};G.rt[0]={cd:0,shoot:0,pop:0,tgt:null};
    G.en=[];G.doneSpawn=true;G.plan=[];G.gap=99;G.wi=9;
    spawnAt('orc',.5,.5);
    update(.05);
    return G.arrows.length>=3;
  });
  check('arcane throws orcs and not bosses',()=>{
    startStage(2);G.en=[];
    const o=spawnAt('orc',.5,.5),b=spawnAt('staff',.52,.5);
    const oh=o.hp,bh=b.hp;
    cast('arcane',.5,.5);
    return o.fly===1&&!b.fly&&o.hp<oh&&b.hp<bh;
  });
  check('fire hits inside the circle only',()=>{
    startStage(1);G.en=[];
    const near=spawnAt('orc',.5,.5),far=spawnAt('orc',.5,.9);
    const h1=near.hp,h2=far.hp;
    cast('fire',.5,.5);
    return near.hp<h1&&near.burn>0&&far.hp===h2;
  });
  check('tornado pulls orcs inward',()=>{
    startStage(1);
    for(let i=0;i<8;i++){SV.slots[i]=null;G.rt[i]=null;}
    G.en=[];G.doneSpawn=true;G.gap=99;G.plan=[];
    const o=spawnAt('orc',.68,.5);const x0=o.x;
    cast('tornado',.5,.5);
    for(let i=0;i<20;i++)update(1/60);
    return o.x<x0-.02;
  });
  check('bodies stay briefly then fade',()=>{
    startStage(1);G.en=[];G.doneSpawn=true;G.gap=99;
    const o=spawnAt('orc',.5,.4);hurt(o,9999,'#fff');
    const stayed=o.corpse&&G.en.indexOf(o)>=0;
    update(.2);
    const mid=G.en.indexOf(o)>=0;
    update(1.3);
    return stayed&&mid&&G.en.indexOf(o)<0;
  });
  check('wall takes damage at the gate',()=>{
    startStage(1);
    for(let i=0;i<8;i++){SV.slots[i]=null;G.rt[i]=null;}
    G.en=[];G.doneSpawn=true;G.gap=99;G.plan=[];
    const o=spawnAt('orc',.5,.99);o.dps=30;
    const hp=G.hp;update(.4);
    return G.hp<hp-5;
  });
  check('breach drops DEFEAT',()=>{
    G.en=[];const o=spawnAt('orc',.5,1);o.dps=50000;o.z=1;update(.05);
    return G.over==='lose'&&G.banner&&G.banner.word==='DEFEAT'&&mode==='end';
  });
  check('clearing the field drops VICTORY',()=>{
    startStage(3);G.en=[];G.doneSpawn=true;G.plan=[];G.gap=99;update(.05);
    return G.over==='win'&&G.banner&&G.banner.word==='VICTORY';
  });
  check('free speed stops at 2x',()=>{
    const evo=SV.evo,maxp=SV.maxp,pack=SV.pack;
    SV.evo=0;SV.maxp=0;SV.pack=0;
    startStage(1);setSpeed(5);
    const blocked=G.spd<=2;
    SV.evo=1;setSpeed(5);
    const open=G.spd===5;
    setSpeed(2);
    SV.evo=evo;SV.maxp=maxp;SV.pack=pack;
    return blocked&&open&&G.spd===2;
  });
  check('repair spends coins and heals',()=>{
    startStage(1);SV.coins=500;G.hp=10;
    const c0=SV.coins,h0=G.hp;healWall();
    return SV.coins<c0&&G.hp>h0;
  });
  check('raise increases max HP during a stage',()=>{
    const m0=G.maxhp,u0=SV.up.hp|0,h0=G.hp;SV.coins=100000;
    const ok=raiseWall();
    return ok&&G.maxhp===m0+22&&(SV.up.hp|0)===u0+1&&G.hp===Math.min(G.maxhp,h0+22);
  });
  check('manual aim prefers the marked enemy',()=>{
    startStage(1);
    for(let i=0;i<8;i++){SV.slots[i]=null;G.rt[i]=null;}
    SV.slots[0]={tier:2,aim:{x:.2,z:.4}};
    G.rt[0]={cd:0,shoot:0,pop:0,tgt:null};
    G.en=[];
    const a=spawnAt('orc',.2,.4),b=spawnAt('orc',.88,.86);
    const pick=pickTarget(0);
    return pick&&pick.enemy===a&&b&&a;
  });
  check('upgrade screen resumes at top and bottom',()=>{
    startStage(2);openUpg();
    const html=ui.innerHTML;
    const n=(html.match(/▶ Resume/g)||[]).length;
    const top=html.indexOf('▶ Resume');
    const bot=html.lastIndexOf('▶ Resume');
    return mode==='upg'&&n>=2&&top<html.indexOf('Upgrades')&&bot>html.lastIndexOf('Speed packs')&&html.includes('Repair wall')&&html.includes('Raise wall HP');
  });
  check('stage sim stays stable',()=>{
    startStage(4);SV.evo=1;setSpeed(5);
    for(let i=0;i<8;i++){SV.slots[i]={tier:i%5,aim:null};G.rt[i]={cd:0,shoot:0,pop:0,tgt:null};}
    for(let i=0;i<60*8&&mode==='play';i++)update(1/60);
    return G.arrows.length<=80&&G.en.length<=40;
  });
  try{SV=JSON.parse(saved);save();}catch(e){lines.push('FAIL restore save :: '+e.message);}
  const fails=lines.filter(l=>l.startsWith('FAIL')).length;
  lines.push(fails?('FAILED '+fails):'ALL PASS');
  return lines.join('\n');
}

let last=performance.now();
function loop(now){
  const real=Math.min(.05,(now-last)/1000)||0;
  last=now;
  clock+=real;
  if(document.hidden){requestAnimationFrame(loop);return;}
  try{
    if(G&&mode==='play'&&!G.freeze){
      let budget=real*(G.spd||1),guard=0;
      while(budget>0&&mode==='play'&&guard++<24){
        const dt=Math.min(1/60,budget);
        update(dt);
        budget-=dt;
      }
    }else if(G&&mode==='end'&&!G.freeze){
      updateBanner(real);
      update(real);
      if(G.shake>0)G.shake=Math.max(0,G.shake-real*1.4);
    }
    draw();
  }catch(err){
    fatal=String(err&&err.stack||err);
    console.error(err);
  }
  requestAnimationFrame(loop);
}
function hideSplash(){
  if(splashGone)return;
  splashGone=true;
  splash.style.display='none';
  lockInputUntil=performance.now()+400;
  unlockAudio();
}
splash.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();hideSplash();});
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();last=performance.now();}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function boot(){
  ensureArt();
  if(QS.get('selftest')==='1'){
    splash.style.display='none';splashGone=true;
    const report=runSelfTest();
    window.__TEST_RESULT=report;
    mode='test';
    ui.style.display='block';
    ui.textContent=report;
    return;
  }
  if(QS.get('scene')){
    splash.style.display='none';splashGone=true;
    setupScene(QS.get('scene'));
    return;
  }
  showMenu();
}
window.__td={
  startStage,dropUnit,cast,healWall,raiseWall,setSpeed,summon,arrowCount,pickTarget,
  project,screenToWorld,spawnAt,update,paid,wallMax,SPEEDS,checkout,syncEnt,restorePurchases,
  playerId,PRICE,setupScene,
  get G(){return G;},get SV(){return SV;},get mode(){return mode;}
};
boot();
requestAnimationFrame(loop);
payBoot();
