// ---- stage gen ----
function genStage(n){const r=rng(n*7919+13),lanes=1+(n>20&&r()<.5)+(n>80&&r()<.4);
 const paths=[];for(let l=0;l<lanes;l++){let x=60+r()*240,p=[[x,-30]];for(let y=60;y<500;y+=70+r()*40){x=Math.max(30,Math.min(330,x+(r()-.5)*180));p.push([x,y])}p.push([80+r()*200,525]);paths.push(p)}
 const nw=10+Math.floor(n/50),diff=1+n*.12+Math.pow(n,1.35)*.02,waves=[];
 const pool=['soldier','runner'].concat(n>3?['heavy']:[],n>6?['tank']:[]);
 for(let w=0;w<nw;w++){const list=[],cnt=6+w*2+Math.floor(n/8);for(let i=0;i<cnt;i++)list.push(pool[Math.floor(r()*pool.length)]);
  if(w==nw-1&&(n%5==0))list.push('boss');waves.push(list)}
 const deco=[];for(let i=0;i<40;i++)deco.push([r()*W,r()*520,r()]);
 return{n,paths,waves,diff,deco,hue:90+r()*40}}

function spawn(type){const e=ETYPES[type],st=G.st,p=st.paths[Math.floor(Math.random()*st.paths.length)];

 if(Math.random()<(e.type=='boss'?1:.07)){const d=DROPS[Math.floor(Math.random()*DROPS.length)];G.drops.push({x:e.x,y:Math.min(e.y,500),d,l:8})}}

function ring(x,y,r,c){G.fx.push({ring:1,x,y,r,c,l:.4})}
function volley(x,y){if(G.vol>0)return;G.vol=G.volCd;snd(600,.15,'triangle');const R=60+SV.up.volley*6;
 for(let i=0;i<18;i++)G.ar.push({x:SLOTX[i%5],y:SLOTY,tx:x+(Math.random()-.5)*R*1.5,ty:y+(Math.random()-.5)*R*1.5,v:600,c:'#fff',vol:1,d:(12+G.st.n*.8)*dmgMul()})}
// ---- update ----
function update(dt){const g=G;g.t+=dt;g.vol=Math.max(0,g.vol-dt);g.shake=Math.max(0,g.shake-dt);
 if(!g.spawnQ.length&&!g.en.length){g.waveT-=dt;if(g.waveT<=0){if(g.wave>=g.st.waves.length)return win();g.spawnQ=g.st.waves[g.wave].slice();g.wave++;g.waveT=3;snd(440,.2,'triangle')}}
 if(g.spawnQ.length){g.spawnT-=dt;if(g.spawnT<=0){spawn(g.spawnQ.shift());g.spawnT=Math.max(.25,.9-g.st.n*.002)}}
 for(const e of g.en){if(e.burn>0){e.burn-=dt;hit(e,e.burnD*dt,'#f60')}
  if(e.kb>0){e.kb-=dt;e.y-=90*dt;continue}if(e.stun>0){e.stun-=dt;continue}if(e.root>0){e.root-=dt;continue}
  let sp=e.sp*(e.slow>0?.45:1);e.slow-=dt;const t=e.p[e.i];if(!t){e.hp=0;g.hp-=e.type=='boss'?10:1;g.shake=.25;snd(70,.25,'square',.08);continue}
  const dx=t[0]-e.x,dy=t[1]-e.y,d=Math.hypot(dx,dy);if(d<4)e.i++;else{e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt}}
 g.en=g.en.filter(e=>e.hp>0);if(g.hp<=0)return lose();
 const rm=1+SV.up.rate*.08;
 g.slots.forEach((s,i)=>{if(!s)return;s.cd-=dt*rm;if(s.cd>0)return;const T=TYPES[s.t];let best=null,bd=1e9;
  for(const e of g.en){const d=Math.hypot(e.x-SLOTX[i],e.y-SLOTY);if(d<T.range+s.lv*10&&e.y>bd*0-1e9&&(500-e.y)<bd){bd=500-e.y;best=e}}
  if(best){s.cd=T.rate;g.ar.push({x:SLOTX[i],y:SLOTY-14,tgt:best,v:520,c:T.c,t:s.t,d:T.dmg*(1+(s.lv-1)*.5)*dmgMul()*(1+g.st.n*.06)});snd(900+s.t*80,.03,'triangle',.02)}});
 for(const a of g.ar){if(a.vol){const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<8){a.dead=1;g.en.forEach(e=>{if(Math.hypot(e.x-a.tx,e.y-a.ty)<26)hit(e,a.d,'#fff')})}else{a.x+=dx/d*a.v*dt;a.y+=dy/d*a.v*dt}continue}
  const e=a.tgt;if(e.hp<=0&&!a.lx){a.lx=e.x;a.ly=e.y}const tx=a.lx??e.x,ty=a.ly??e.y,dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);
  if(d<8){a.dead=1;if(e.hp>0)effect(a,e)}else{a.x+=dx/d*a.v*dt;a.y+=dy/d*a.v*dt;a.ang=Math.atan2(dy,dx)}}
 g.ar=g.ar.filter(a=>!a.dead);
 g.fx.forEach(f=>{f.l-=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt}if(f.sw)f.y+=(f.ty-f.y)*dt*10});g.fx=g.fx.filter(f=>f.l>0);
 g.txt.forEach(t=>{t.l-=dt;t.y-=30*dt});g.txt=g.txt.filter(t=>t.l>0);g.drops.forEach(d=>d.l-=dt);g.drops=g.drops.filter(d=>d.l>0)}
function effect(a,e){const boss=e.type=='boss';hit(e,a.d,a.c);G.fx.push({img:TYPES[a.t]?.k,x:e.x,y:e.y,l:.3,s:22+Math.random()*8});
 if(a.t==0){e.burn=3;e.burnD=a.d*.6}
 if(a.t==1){e.slow=2;if(Math.random()<.15)e.stun=boss?.3:1.2}
 if(a.t==2){let cur=e,hitset=[e];for(let k=0;k<3;k++){const n=G.en.find(o=>o.hp>0&&!hitset.includes(o)&&Math.hypot(o.x-cur.x,o.y-cur.y)<80);if(!n)break;G.fx.push({bolt:1,x1:cur.x,y1:cur.y,x2:n.x,y2:n.y,l:.15});hit(n,a.d*.7,'#ff0');hitset.push(n);cur=n}}
 if(a.t==3){if(!boss){e.kb=.25;e.stun=.6}else e.stun=.15;G.shake=.08}
 if(a.t==4){if(Math.random()<.35)e.root=boss?.4:1.5}}
function win(){mode='end';const n=G.st.n,c=G.coins+20+n*5;SV.coins+=c;if(SV.stage==n&&n<500)SV.stage=n+1;SV.max=Math.max(SV.max,SV.stage);save();snd(660,.4,'triangle');screen(`<h2>🏆 Stage ${n} cleared!</h2><p>+${c} 🪙</p>`)}
function lose(){mode='end';const c=Math.floor(G.coins/2);SV.coins+=c;save();screen(`<h2>💀 Defense broken (stage ${G.st.n}, wave ${G.wave})</h2><p>+${c} 🪙 salvage. Upgrade and retry!</p>`)}
// ---- menus ----
const UPS=[['dmg','Archer damage +15%'],['rate','Fire rate +8%'],['energy','Start energy +25'],['hp','Base HP +5'],['volley','Volley: faster & wider']];
const upCost=k=>Math.floor(40*Math.pow(1.35,SV.up[k]));
function screen(head=''){ui.style.display='block';let h=head+`<h2>🏹 Archer TD</h2><div>Stage <b>${SV.stage}</b>/500 · 🪙 <b id=co>${SV.coins}</b>${SV.pack?' · Boost x'+packMul():''}</div>
<button class=btn onclick="startStage(SV.stage)">▶ Play stage ${SV.stage}</button>${SV.stage>1?`<button class=btn style="background:#555" onclick="startStage(SV.stage-1)">Replay ${SV.stage-1}</button>`:''}<h3>Upgrades</h3>`;
 UPS.forEach(([k,n])=>h+=`<div class=row><span>${n} <small>(Lv ${SV.up[k]})</small></span><button class=btn onclick="buyUp('${k}')">${upCost(k)}🪙</button></div>`);
 h+=`<h3>Shop</h3><div class=demo>⚠️ DEMO ONLY — no real payment is made. Prices are mock.</div>
 <div class=row><span>Commander Pack: x1.6 damage forever + 500🪙</span><button class=btn onclick="pack(1)">₱499 (demo)</button></div>
 <div class=row><span>Warlord Pack: x2.4 damage forever + 1500🪙</span><button class=btn onclick="pack(2)">₱999 (demo)</button></div>
 <p style="font-size:13px;opacity:.8">How to play: tap an archer card then a slot (or drag card onto slot). Drag a deployed archer onto another slot to swap. Drop same type on it to level up. Tap the field to fire your Volley when charged. Tap dropped items (💣⚡⚔️❄️💰) fast before they vanish!</p>
 <button class=btn style="background:#733" onclick="if(confirm('Reset all progress?')){localStorage.removeItem('archerTD');location.reload()}">Reset save</button>`;ui.innerHTML=h}
function buyUp(k){const c=upCost(k);if(SV.coins<c)return;SV.coins-=c;SV.up[k]++;save();screen()}
function pack(n){if(!confirm('DEMO: no real money is charged. Grant pack?'))return;if(n>SV.pack){SV.pack=n}SV.coins+=n==1?500:1500;save();screen()}
// ---- input ----
const CARDY=600,CARDW=68;
function pos(ev){const r=cv.getBoundingClientRect(),t=ev.changedTouches?ev.changedTouches[0]:ev;return[(t.clientX-r.left)/S,(t.clientY-r.top)/S]}
function slotAt(x,y){for(let i=0;i<5;i++)if(Math.hypot(x-SLOTX[i],y-SLOTY)<32)return i;return-1}
function cardAt(x,y){if(y>CARDY-26&&y<CARDY+30)return Math.min(4,Math.floor((x-4)/(CARDW+3)));return-1}
function place(i,t){const g=G,s=g.slots[i],T=TYPES[t];if(s&&s.t==t){const c=T.cost*s.lv;if(g.energy<c||s.lv>=5)return;g.energy-=c;s.lv++;g.txt.push({x:SLOTX[i],y:SLOTY-30,s:'LV '+s.lv,l:1});snd(800,.1);return}
 if(g.energy<T.cost)return;g.energy-=T.cost;g.slots[i]={t,lv:1,cd:0};ring(SLOTX[i],SLOTY,30,T.c);snd(520,.08)}
function down(ev){ev.preventDefault();if(mode!='play')return;const[x,y]=pos(ev),g=G;
 if(x>W-50&&y<40){mode='pause';screen('<h2>⏸ Paused</h2><button class=btn onclick="mode=\'play\';ui.style.display=\'none\'">Resume</button>');return}
 for(const d of g.drops)if(Math.hypot(d.x-x,d.y-y)<26){d.l=0;useDrop(d);return}
 const c=cardAt(x,y);if(c>=0){g.drag={card:c,x,y};g.sel=c;return}
 const s=slotAt(x,y);if(s>=0){if(g.sel>=0){place(s,g.sel);return}if(g.slots[s])g.drag={slot:s,x,y};return}
 if(y<520)volley(x,y)}
function move(ev){ev.preventDefault();if(G&&G.drag){const[x,y]=pos(ev);G.drag.x=x;G.drag.y=y}}
function up(ev){ev.preventDefault();if(!G||!G.drag)return;const[x,y]=pos(ev),d=G.drag,s=slotAt(x,y);G.drag=null;
 if(d.card!=null&&s>=0){place(s,d.card)}else if(d.slot!=null&&s>=0&&s!=d.slot){const a=G.slots;[a[s],a[d.slot]]=[a[d.slot],a[s]];snd(400,.05)}}
cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up,{passive:false});
cv.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
// ---- draw ----
function draw(){const g=G;cx.save();if(g.shake>0)cx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
 cx.fillStyle=`hsl(${g.st.hue},45%,42%)`;cx.fillRect(-10,-10,W+20,H+20);
 g.st.deco.forEach(([x,y,r])=>{cx.fillStyle=r<.5?`hsl(${g.st.hue},50%,34%)`:'#2d5a22';cx.beginPath();cx.arc(x,y,r<.5?3+r*6:8+r*6,0,7);cx.fill()});
 g.st.paths.forEach(p=>{cx.lineJoin=cx.lineCap='round';cx.strokeStyle='#8a6a3f';cx.lineWidth=40;cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(...q):cx.moveTo(...q));cx.stroke();cx.strokeStyle='#c9a46a';cx.lineWidth=32;cx.stroke()});
 cx.fillStyle='#6b4b2a';cx.fillRect(0,515,W,14);cx.fillStyle='#8b6239';for(let x=0;x<W;x+=18)cx.fillRect(x,510,12,22);
 cx.fillStyle='#3b3b46';cx.fillRect(0,529,W,111);
 for(const e of g.en){cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(e.x,e.y+e.r*.7,e.r,e.r*.4,0,0,7);cx.fill();
  if(e.type=='tank'||e.type=='boss'){cx.fillStyle=e.c;cx.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);cx.fillStyle='#222';cx.fillRect(e.x-e.r-3,e.y-e.r,4,e.r*2);cx.fillRect(e.x+e.r-1,e.y-e.r,4,e.r*2);cx.fillStyle='#333';cx.fillRect(e.x-2,e.y,4,e.r+6);cx.beginPath();cx.arc(e.x,e.y,e.r*.5,0,7);cx.fill()}
  else{cx.fillStyle=e.c;cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fill();cx.fillStyle='#3a4a22';cx.beginPath();cx.arc(e.x,e.y-2,e.r*.7,0,7);cx.fill();cx.fillStyle='#000';cx.fillRect(e.x-3,e.y+1,2,2);cx.fillRect(e.x+1,e.y+1,2,2)}
  if(e.burn>0){cx.fillStyle='rgba(255,100,0,.5)';cx.beginPath();cx.arc(e.x,e.y-e.r,4+Math.random()*3,0,7);cx.fill()}
  if(e.slow>0||e.stun>0){cx.strokeStyle='#9ef';cx.lineWidth=2;cx.beginPath();cx.arc(e.x,e.y,e.r+3,0,7);cx.stroke()}
  if(e.root>0){cx.strokeStyle='#2a8';cx.lineWidth=3;for(let k=0;k<3;k++){cx.beginPath();cx.arc(e.x,e.y,e.r+2-k*3,k,k+3);cx.stroke()}}
  cx.fillStyle='#000';cx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2,4);cx.fillStyle='#4f4';cx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2*Math.max(0,e.hp/e.max),4)}
 for(const a of g.ar){if(!a.vol&&IMG[TYPES[a.t]?.k]){const im=IMG[TYPES[a.t].k].arrow,an=a.ang||-1.57;if(im.naturalWidth){cx.save();cx.translate(a.x,a.y);cx.rotate(an);cx.drawImage(im,-im.naturalWidth*.75,-im.naturalHeight*.4,im.naturalWidth*.8,im.naturalHeight*.8);cx.restore();continue}}cx.strokeStyle=a.c;cx.lineWidth=3;cx.beginPath();const an=a.vol?Math.atan2(a.ty-a.y,a.tx-a.x):(a.ang||-1.57);cx.moveTo(a.x,a.y);cx.lineTo(a.x-Math.cos(an)*12,a.y-Math.sin(an)*12);cx.stroke()}
 for(const f of g.fx){cx.globalAlpha=Math.min(1,f.l*3);if(f.ring){cx.strokeStyle=f.c;cx.lineWidth=4;cx.beginPath();cx.arc(f.x,f.y,f.r*(1-f.l*1.5),0,7);cx.stroke()}
  else if(f.bolt){cx.strokeStyle='#ffef6a';cx.lineWidth=3;cx.beginPath();cx.moveTo(f.x1,f.y1);for(let k=1;k<5;k++)cx.lineTo(f.x1+(f.x2-f.x1)*k/5+(Math.random()-.5)*14,f.y1+(f.y2-f.y1)*k/5);cx.lineTo(f.x2,f.y2);cx.stroke()}
  else if(f.img){dimg(IMG[f.img].hit,f.x,f.y,f.s*(1.4-f.l))}
  else if(f.sw){cx.fillStyle='#ddd';cx.fillRect(f.x-2,f.y-18,4,22);cx.fillStyle='#a70';cx.fillRect(f.x-6,f.y-20,12,3)}
  else{cx.fillStyle=f.c;cx.fillRect(f.x,f.y,f.s,f.s)}}cx.globalAlpha=1;
 cx.font='22px sans-serif';cx.textAlign='center';for(const d of g.drops){const b=Math.sin(g.t*8)*3;cx.fillStyle='rgba(255,255,255,'+(.4+.3*Math.sin(g.t*10))+')';cx.beginPath();cx.arc(d.x,d.y+b,18,0,7);cx.fill();cx.fillText(d.d.i,d.x,d.y+8+b)}
 g.slots.forEach((s,i)=>{const x=SLOTX[i];cx.fillStyle=s?'#5a5a66':'#4a4a55';cx.beginPath();cx.arc(x,SLOTY,28,0,7);cx.fill();cx.strokeStyle=g.sel>=0?'#ff0':'#777';cx.lineWidth=2;cx.stroke();
  if(s){const T=TYPES[s.t];if(dimg(IMG[T.k].portrait,x,SLOTY-4,54)){cx.fillStyle='#fff';cx.font='bold 10px sans-serif';cx.fillText('★'.repeat(s.lv),x,SLOTY+24)}else{cx.fillStyle=T.c;cx.beginPath();cx.arc(x,SLOTY-4,16,0,7);cx.fill();cx.fillStyle='#fde3b6';cx.beginPath();cx.arc(x,SLOTY-6,8,0,7);cx.fill();cx.strokeStyle='#5a3';cx.lineWidth=2;cx.beginPath();cx.arc(x+10,SLOTY-6,10,-1.2,1.2);cx.stroke();cx.fillStyle='#fff';cx.font='bold 10px sans-serif';cx.fillText('★'.repeat(s.lv),x,SLOTY+22)}}
  else{cx.fillStyle='#888';cx.font='20px sans-serif';cx.fillText('+',x,SLOTY+7)}});
 TYPES.forEach((T,i)=>{const x=4+i*(CARDW+3),ok=g.energy>=T.cost;cx.fillStyle=g.sel==i?'#fff':ok?T.c:'#555';cx.fillRect(x,CARDY-24,CARDW,50);cx.globalAlpha=ok?1:.5;dimg(IMG[T.k].portrait,x+16,CARDY+1,48);cx.globalAlpha=1;cx.fillStyle='#000';cx.font='bold 12px sans-serif';cx.fillText(T.n,x+CARDW-19,CARDY-4);cx.font='12px sans-serif';cx.fillText('⚡'+T.cost,x+CARDW-19,CARDY+14)});
 cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(0,0,W,34);cx.fillStyle='#fff';cx.font='bold 14px sans-serif';cx.textAlign='left';
 cx.fillText(`St ${g.st.n}  Wave ${g.wave}/${g.st.waves.length}  ❤${g.hp}  ⚡${Math.floor(g.energy)}`,8,22);cx.textAlign='center';cx.fillText('⏸',W-20,22);
 cx.fillStyle=g.vol>0?'#666':'#ff0';cx.fillRect(8,38,120*(1-g.vol/g.volCd),5);cx.font='10px sans-serif';cx.fillStyle='#fff';cx.textAlign='left';cx.fillText(g.vol>0?'Volley charging':'VOLLEY READY – tap field!',8,54);cx.textAlign='center';
 g.txt.forEach(t=>{cx.globalAlpha=t.l;cx.font='bold 14px sans-serif';cx.fillStyle='#ff0';cx.fillText(t.s,t.x,t.y)});cx.globalAlpha=1;
 if(g.drag){cx.globalAlpha=.7;const t=g.drag.card!=null?g.drag.card:g.slots[g.drag.slot]?.t;if(t!=null&&!dimg(IMG[TYPES[t].k].portrait,g.drag.x,g.drag.y,50)){cx.fillStyle=TYPES[t].c;cx.beginPath();cx.arc(g.drag.x,g.drag.y,18,0,7);cx.fill()}cx.globalAlpha=1}
 if(!g.spawnQ.length&&!g.en.length&&g.wave<g.st.waves.length){cx.fillStyle='#fff';cx.font='bold 22px sans-serif';cx.fillText(g.wave==0?'Deploy archers!':'Wave '+(g.wave+1)+' incoming',W/2,260)}
 cx.restore()}
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(G){if(mode=='play')update(dt);draw()}else{cx.fillStyle='#1b2a14';cx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);screen();
window.__td={startStage,genStage,get G(){return G},SV};
</script></body></html>
